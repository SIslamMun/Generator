# ==============================================================================
# TOOL-USE PROMPTS
# ==============================================================================
# Design principles:
#
#   1. GENERIC and DOMAIN-AGNOSTIC. No tool names, parameter names, or example
#      values are hardcoded for any specific MCP server. Domain data is
#      injected via format variables that the calling Python code fills:
#        {tool_name}, {tool_description}, {parameters}, {examples}
#        {api_documentation}, {instruction}, {tools_json}, {tools_documentation}
#
#   2. COMPACT. Small teachers (gpt-oss:20b, haiku, qwen2.5:7b) lose attention
#      on long prompts. Each active prompt is <~80 lines. Keep it tight.
#
#   3. PARSER-COMPATIBLE. Output schemas match what
#      src/generator/tool/tool_generator.py already parses. Do NOT change
#      field names — the Python code depends on them.
#
#   4. GROUNDED REASONING. Every `thought` field must name the tool being
#      called and quote the specific parameter values it uses. Generic
#      "the user wants X" reasoning is rejected — small fine-tuned models
#      trained on ungrounded thoughts hallucinate at inference time.
#
#   5. ANTI-HALLUCINATION. The teacher must NOT invent tools, parameter
#      names, parameter types, or return shapes that aren't in the provided
#      API documentation / examples.
#
#   6. RESULT SHAPES MUST MATCH REAL TOOL RETURNS. The `examples` field on
#      each tool in the catalog contains real captured input/output pairs.
#      The teacher must model its `expected_result` on those literal shapes,
#      not invent generic "success/message" wrappers.
# ==============================================================================


# ------------------------------------------------------------------------------
# INSTRUCTION GENERATION — SINGLE TOOL
# Called from tool_generator.py:81
# vars: {tool_name}, {tool_description}, {parameters}, {examples},
#       {n_instructions_min}, {n_instructions_max}
# ------------------------------------------------------------------------------
tool_instruction_generation: |
  Generate {n_instructions_min}-{n_instructions_max} realistic user requests
  that each require exactly ONE call to the tool below.

  TOOL
    name:        {tool_name}
    description: {tool_description}
    parameters:  {parameters}
    real_examples_of_usage: {examples}

  Rules:
    1. Each request must cleanly map to ONE call of THIS tool — not another
       tool, not multiple tools.
    2. Mix phrasing: ~40% direct commands ("Do X"), ~40% polite/indirect
       ("Could you set up X..."), ~20% contextual/terse ("For tonight's
       run, X" or "new X").
    3. Mix difficulty: ~40% simple (one obvious parameter), ~40% medium
       (parameter buried in natural prose), ~20% complex (implicit naming
       or multiple distractors).
    4. ALL requests must be SUCCESS cases — values that fit the tool's
       schema (correct enum members, well-formed identifiers, in-range
       parameters). Do NOT generate error-triggering instructions here.
       Failure scenarios are produced separately by the error-recovery
       generator, which annotates them with proper failure status, real
       error payloads, and recovery steps. Mixing failure cases into
       single-step success generation creates training rows where the
       model is taught to lie about bad inputs.
    5. Use CONCRETE, PLAUSIBLE parameter values appropriate to the tool's
       domain — draw inspiration from real_examples_of_usage. Never use
       placeholders like "test", "foo", "my_thing", "value1". When the
       schema declares an enum, pick from that enum only.
    6. Every request is distinct — no near-duplicates.

  Output: ONE JSON array, no markdown fences, no prose.
  [
    {{"instruction": "<user request>", "difficulty": "simple|medium|complex", "scenario": "<one sentence context>"}}
  ]

  Anti-examples (do NOT produce these):
    "Use the tool"                       → FAIL: no parameter value
    "Create a <thing> called test"       → FAIL: "test" is a placeholder
    "Do X and then do Y"                 → FAIL: requires multiple tools
    "Use a nonexistent <thing>"          → FAIL: don't TELL the user it's
                                            nonexistent — name a plausible-
                                            sounding but unknown identifier
                                            instead (a value that fits the
                                            naming convention of
                                            real_examples_of_usage but
                                            doesn't actually exist)

  Return ONLY the JSON array.


# ------------------------------------------------------------------------------
# INSTRUCTION GENERATION — MULTI-TOOL
# Called from tool_generator.py:228
# vars: {tools_documentation}
# ------------------------------------------------------------------------------
multi_tool_instruction_generation: |
  Generate ONE realistic user request that requires 2-5 of the tools below,
  used in sequence or in parallel.

  AVAILABLE TOOLS:
  {tools_documentation}

  Rules:
    1. Tools must chain logically — earlier tools' effects enable later ones.
    2. Do NOT name tools explicitly in the request ("call X then Y" is
       rejected). The model under training must infer which tools to use.
    3. Every parameter the request mentions must be a concrete, plausible
       value (no placeholders like "foo", "test", "name1").
    4. The request must have a clear end state (a resource is ready, a run
       is launched, a report is generated).
    5. `expected_tools` must be a subset of the tools listed above — never
       invent a tool not in the catalog.

  Output: ONE JSON object, no fences, no prose.
  {{
    "instruction": "<natural language request>",
    "difficulty": "medium|complex",
    "scenario": "<one sentence context>",
    "expected_tools": ["<tool_name>", "<tool_name>"]
  }}

  Anti-examples:
    "Call create then run" → FAIL: names tool verbs explicitly
    expected_tools contains a tool not in tools_documentation → FAIL

  Return ONLY the JSON object.


# ------------------------------------------------------------------------------
# SOLUTION ANNOTATION — SINGLE STEP
# Called from tool_generator.py:310
# vars: {api_documentation}, {instruction}
# Parser (tool_generator.py:322-328) expects:
#   {thought, tool, args, expected_result, final_answer}
# ------------------------------------------------------------------------------
tool_solution_single: |
  Produce the canonical single-step solution for the user request below.
  This becomes training data for a tool-calling model — quality matters.

  API DOCUMENTATION (the ONLY tools that exist — do not invent others):
  {api_documentation}

  USER REQUEST: {instruction}

  Hard rules:
    1. `thought` MUST reference the specific parameter values from the user
       request AND name the tool chosen AND explain why it matches the
       tool's schema. Generic "the user wants X" reasoning is REJECTED.
    2. `tool` MUST be a name from api_documentation. No invented tools.
    3. `args` keys MUST exactly match the tool's parameter names in
       api_documentation. No renaming, no abbreviating, no adding keys the
       schema doesn't declare.
    4. `args` values must be CORRECTLY TYPED: integers for ints, strings
       for strings (including size/duration strings with unit suffixes if
       the tool's examples show them that way), booleans as true/false.
    5. `expected_result` MUST match the shape shown in the tool's real
       example outputs from api_documentation — same keys, same value
       types. Do NOT invent generic wrappers like {{"success": true}}
       unless that's literally the real return shape.
    6. `final_answer` is 1-2 sentences of natural language to the user that
       names the actual parameter values. NO raw JSON, NO code blocks, NO
       "I called the tool" meta-talk.

  Output: ONE JSON object, no fences, no prose.
  {{
    "thought": "<grounded reasoning — references specific values AND tool AND schema fit>",
    "tool": "<tool name from api_documentation>",
    "args": {{"<exact param name>": <correctly typed value>}},
    "expected_result": {{"<shape matching the tool's real example output>"}},
    "final_answer": "<1-2 sentence natural reply to the user>"
  }}

  Anti-examples (do NOT produce these):
    "thought": "The user wants to perform an action"
      → FAIL: content-free, not grounded
    "tool": "invented_tool_name"
      → FAIL: not in api_documentation
    "args": {{"target": "foo"}} when schema says parameter is "name"
      → FAIL: wrong key, and "foo" is a placeholder
    "expected_result": {{"success": true, "message": "ok"}}
      → FAIL: invented shape if the real tool returns something else
    "final_answer": "Called the tool with the given arguments."
      → FAIL: robotic meta-talk instead of answering the user

  Return ONLY the JSON object.


# ------------------------------------------------------------------------------
# SOLUTION ANNOTATION — MULTI STEP
# Called from tool_generator.py:350
# vars: {api_documentation}, {instruction}, {tools_json}, {max_steps}
# Parser (tool_generator.py:366-380) expects:
#   {reasoning_path: [{step, thought, tool, args, expected_result,
#                      actual_result?, status?, error_message?}],
#    final_answer}
# ------------------------------------------------------------------------------
tool_solution_multi: |
  Produce a multi-step solution for the user request below using the
  NEXT-ACTION PREDICTOR pattern: each step reasons about the ONE correct
  next action given what has already happened — NOT a pre-planned sequence.

  API DOCUMENTATION:
  {api_documentation}

  TOOLS (JSON schema):
  {tools_json}

  USER INSTRUCTION: {instruction}

  Hard rules:
    1. Use the MINIMUM number of steps needed, up to {max_steps}. No padding.
    2. Step 1's thought reasons from the user request alone.
    3. Every step after step 1 MUST reference the PRIOR step's result in
       its thought — e.g. "Step 1 returned status=created, so now I
       need..." or "The previous call failed with <error>, so...". Steps
       that don't reference prior state are rejected.
    4. Every thought is 1-3 sentences, grounded in specific parameter
       values and tool names. Generic phrases rejected.
    5. Tool names, arg keys, and expected_result shapes must come from
       api_documentation / tools_json. Never invent.
    6. Do NOT embed the tool's response text inside your own thought. The
       tool's output belongs in `expected_result` only.
    7. ERROR-RECOVERY HANDLING (important for training data balance):

       Before writing step 1, decide whether this instruction is likely to
       fail. Signals that it WILL fail (domain-agnostic):
         - the instruction references a resource by name/id that was
           never created/registered earlier in this conversation
         - the instruction uses a parameter value that looks plausible
           but probably isn't a valid enum member or known identifier
         - the instruction skips a prerequisite that the tool's contract
           implies (acting on a resource before it was initialized)
         - the instruction violates a parameter constraint (out-of-range,
           wrong format, malformed identifier)

       If ANY of the above apply, you MUST produce a FAILING step 1:
         - set `status` to "failure"
         - put the real error payload in `actual_result` — use realistic
           error shapes like "404: <thing> not found",
           "500: <operation> failed: <specific reason>", or
           "422: validation error: <param> must be one of [...]"
         - put a short human-readable error summary in `error_message`
         - then in step 2's thought, quote the error verbatim and justify
           a concrete recovery action (retry with corrected args, create
           the missing prerequisite first, fall back to a related tool,
           or give up gracefully via final_answer if no recovery is
           possible)
         - the recovery step itself should use `status: "success"` unless
           it also fails (in which case continue the chain)

       If the instruction is straightforwardly correct, OMIT status /
       actual_result / error_message entirely — those are only for the
       failure case.
    8. `final_answer` is 1-2 sentences summarizing what was accomplished or
       — if the task failed — what went wrong and what the user should do.

  Output: ONE JSON object, no fences, no prose.
  {{
    "reasoning_path": [
      {{
        "step": 1,
        "thought": "<grounded reasoning from the user request>",
        "tool": "<tool name>",
        "args": {{"<param>": <value>}},
        "expected_result": {{"<shape matching the tool's real return>"}}
      }},
      {{
        "step": 2,
        "thought": "<references step 1's result by its actual field name>",
        "tool": "<tool name>",
        "args": {{}},
        "expected_result": {{}}
      }}
    ],
    "final_answer": "<1-2 sentence summary>"
  }}

  Anti-examples:
    Step 2 thought: "Next I'll do X"
      → FAIL: doesn't reference step 1's result
    Step 1 thought: "I'll do A, then B, then C"
      → FAIL: planning ahead, not next-action reasoning
    `args` keys that aren't in the tool schema
      → FAIL: invented args
    Recovery step that just retries the exact same failing call
      → FAIL: not actually recovering

  Return ONLY the JSON object.


# ------------------------------------------------------------------------------
# CHAIN-FIRST GENERATION (ToolGrad)
# Called from tool_generator.py:589
# vars: {tools_json}, {min_steps}, {max_steps}
# ------------------------------------------------------------------------------
chain_generation: |
  Generate a VALID tool chain of {min_steps}-{max_steps} steps using the
  tools below. Design the mechanically-valid sequence now; a natural-
  language query will be synthesized for it separately.

  AVAILABLE TOOLS:
  {tools_json}

  Hard rules:
    1. Every tool must exist in tools_json.
    2. Every argument name must match the tool's schema exactly.
    3. Argument VALUES must be CONCRETE. Do not use "<placeholder>",
       "$step_N_result", "your_value_here", or "{{step1.output}}" —
       resolve each value to a literal string/integer/bool.
    4. Steps must be executable in order — tool N-1's effect makes tool N
       valid (you can't run something before creating it, etc.).
    5. All steps should share a common context (e.g. same resource ID,
       same workspace, same dataset) unless the task genuinely spans
       multiple contexts.
    6. `expected_result` per step is a short string describing what the
       tool returns — this is a chain sketch, not a full solution.

  Output: ONE JSON object, no fences, no prose.
  {{
    "steps": [
      {{
        "step": 1,
        "thought": "<why this is the right first action>",
        "tool": "<tool name>",
        "args": {{"<param>": <concrete value>}},
        "expected_result": "<short description of what the tool returns>"
      }}
    ],
    "final_answer": "<one sentence describing the chain's outcome>"
  }}

  Anti-examples:
    "args": {{"id": "<your_id>"}}         → FAIL: placeholder
    "args": {{"id": "$step_1_result.id"}} → FAIL: reference, not a value
    Step 1: run_something, Step 2: create_something → FAIL: impossible order

  Return ONLY the JSON object.


# ------------------------------------------------------------------------------
# QUERY SYNTHESIS
# Called from tool_generator.py:627
# vars: {chain_steps}, {tools_used}, {final_result}
# ------------------------------------------------------------------------------
query_synthesis: |
  Write a natural-language user request that would require the tool chain
  below. The model under training must infer the tools — the query should
  NOT name them.

  CHAIN:
  {chain_steps}

  TOOLS USED: {tools_used}
  EXPECTED OUTCOME: {final_result}

  Hard rules:
    1. Do NOT mention tool names in the query.
    2. Every CONCRETE value used in the chain's args MUST appear in the
       query in natural form — nothing may be silently dropped.
    3. 1-3 sentences. No essays. No bullet points.
    4. The query must be unambiguous enough that THIS chain is clearly
       the right interpretation.

  Output: ONE JSON object, no fences.
  {{"query": "<natural language user request>"}}

  Anti-examples:
    "Call tool X then Y"                              → FAIL: names tools
    Query omits a parameter used in the chain         → FAIL
    Query mentions a value the chain doesn't use      → FAIL

  Return ONLY the JSON object.


# ------------------------------------------------------------------------------
# ERROR-RECOVERY EXAMPLE (one-shot full generation)
# Given the tool catalog, produce a complete ToolExample: instruction, a
# failing first step with realistic error, and a recovery chain.
# vars: {api_documentation}, {tools_json}
# ------------------------------------------------------------------------------
tool_error_recovery_full: |
  You are generating a single ERROR-RECOVERY training example from the tool
  catalog below. Pick a realistic scenario where a tool call fails and the
  model must recover.

  API DOCUMENTATION (all tools that exist — do NOT invent others):
  {api_documentation}

  TOOLS (JSON schema):
  {tools_json}

  Your task (ONE output):
    1. Pick ONE realistic FAILURE scenario that a real user would stumble
       into. Domain-agnostic scenario patterns:
         - Asking for info about a resource they haven't created/
           registered yet (any get-by-id call where the id is unknown)
         - Operating on a resource before it was initialized (running
           something that requires a prior setup step)
         - Using an enum/parameter VALUE that sounds plausible but isn't
           in the schema's allowed list
         - Acting on a resource with a slightly-wrong identifier (typo
           in a name slug, off-by-one in a UUID, wrong server/namespace)
         - Skipping a prerequisite that the tool's contract implies
         - Violating a parameter constraint subtly (out-of-range, wrong
           format, value that hits an upstream rate-limit or 502)
    2. Write a natural USER INSTRUCTION that leads to the failing call.
       The user is confident — they do NOT know the call will fail.
    3. Produce the full reasoning_path: step 1 fails with a realistic
       error payload, subsequent steps RECOVER (retry with corrected args,
       create the missing prerequisite first, fall back to a related tool,
       or gracefully report what went wrong via final_answer).

  Rules for the failure step (step 1):
    - `status` MUST be "failure"
    - `actual_result` MUST contain a realistic error payload in one of
      these shapes (pick the one that fits the tool's likely failure):
        "404: <resource> not found"
        "500: <operation> failed: <specific reason>"
        "422: validation error: <param> must be one of [<allowed>]"
        "502: upstream timeout"
        "500: <operation> failed: 'NoneType' object is not iterable"
    - `error_message` = short human-readable summary
    - `expected_result` = the OPTIMISTIC shape the caller expected

  Rules for recovery steps (step 2+):
    - `status` MUST be "success" (unless recovery itself fails — rare)
    - `thought` MUST quote the actual error and justify the recovery
    - `tool` and `args` must come from the catalog
    - NEVER just retry the same call with the same args — that's not
      recovery

  Tool-name rules (apply to EVERY step):
    - `tool` MUST be a name from the catalog.
    - Argument KEYS must match the tool's declared parameter names
      EXACTLY (no renaming, no abbreviating).
    - Result shapes match what the tool's description says it returns.

  Output: ONE JSON object, no fences, no prose.
  {{
    "instruction": "<natural language user request>",
    "metadata": {{
      "error_category": "<short_tag_like 'missing_resource', 'invalid_value', 'missing_prerequisite', 'typo', 'upstream_failure'>",
      "difficulty": "complex"
    }},
    "reasoning_path": [
      {{
        "step": 1,
        "thought": "<pre-failure plan, references user's request>",
        "tool": "<failing tool name>",
        "args": {{"<param>": <value>}},
        "expected_result": {{"<shape the caller expected>"}},
        "actual_result": "<realistic error payload as a JSON string>",
        "status": "failure",
        "error_message": "<short error summary>"
      }},
      {{
        "step": 2,
        "thought": "<quotes the error, justifies recovery>",
        "tool": "<recovery tool>",
        "args": {{}},
        "expected_result": {{}},
        "status": "success"
      }}
    ],
    "final_answer": "<1-2 sentence summary: what went wrong and how it was fixed or why not>"
  }}

  Anti-examples:
    Step 2 retries exact same failing call → FAIL: not recovery
    Step 1 thought references the error before it happens → FAIL
    Invented tool not in catalog → FAIL
    `actual_result` is vague ("An error occurred") → FAIL

  Return ONLY the JSON object.


# ------------------------------------------------------------------------------
# TOOL SIMULATION
# Called from tool_executor.py:145, 179
# vars: {tool_name}, {tool_description}, {return_type}, {args_json}, {context}
# ------------------------------------------------------------------------------
tool_simulation: |
  You are simulating the tool `{tool_name}`. Return the EXACT JSON shape
  the real tool produces. You are the SERVER, not an assistant.

  TOOL
    name:        {tool_name}
    description: {tool_description}
    return type: {return_type}

  CALL:
    {tool_name}({args_json})

  PRIOR CONTEXT (recent tool calls — keep state consistent):
  {context}

  HARD RULES — violating these produces garbage training data:

    1. MATCH THE REAL SHAPE. The tool's description tells you the exact
       return shape. Produce ONLY the keys the description / examples
       mention. Do NOT add "message", "details", "success", "timestamp",
       "metadata", or any other field the description does not declare.

    2. STATUS LITERALS ARE EXACT. If the description says a status field
       has a specific value (e.g. `status='created'`), use exactly that
       literal — not "success", not "ok", not a natural-language sentence.

    3. NO INVENTED ENRICHMENT. Do not add fake execution metadata like
       timestamps, byte counts, duration, or URLs unless the tool's
       description literally says it returns them.

    4. READ-style tools (get-by-id, fetch, describe) return only the
       known keys for that resource. Do not invent new keys.

    5. If prior context shows a state change (a prior write/configure
       call happened), reflect it in subsequent reads.

    6. REALISTIC VALUES ONLY. Never "foo", "bar", "test".

    7. If the call would realistically fail given inputs and context,
       return the error as a JSON STRING with a status code and message
       (e.g. "404: <name> not found", "500: <specific reason>",
       "422: validation error: <reason>"). Use realistic error messages
       that tie back to the args — not generic "An error occurred".

  Output: ONE JSON value (object, array, string, or primitive), nothing
  else. No prose. No fences. No explanation. No markdown.

  Anti-examples (do NOT produce these — the lesson is about SHAPE,
  applies to any tool):
    Call: <write_tool>({{"<id>": "x"}})
      BAD:  {{"status":"success", "message":"done", "details": {{...}}}}   ← invented wrapper
      GOOD: {{"<id>":"x", "<state>":"<literal-from-description>"}}         ← only declared keys

    Call: <list_tool>({{"<filter>": "y"}})
      BAD:  {{"status":"ok", "items":[...], "total_count":3, "elapsed_ms":47}}  ← invented metadata
      GOOD: {{"items":[...], "count":3}}                                         ← matches description shape


# ==============================================================================
# QUALITY / CURATION PROMPTS (orthogonal — used by the curator and evaluator,
# not by the generator pipeline itself).
# ==============================================================================

tool_quality_rating: |
  Rate this tool-calling training example 1-10.

  Instruction: {instruction}
  Tool Usage:  {tool_calls}
  Result:      {result}
  Answer:      {answer}

  Score each (0-3, 0-3, 0-2, 0-2), sum to rating:
    - Tool Selection: right tool for the task?
    - Parameter Correctness: arg names match the tool schema?
    - Reasoning Quality: thought references specific values?
    - Result Realism: result shape matches real tool return?

  Output: ONE JSON object, no fences.
  {{"rating": 8, "tool_selection": 3, "parameter_correctness": 3, "reasoning_quality": 1, "result_realism": 1, "reasoning": "<brief>"}}

  Return ONLY the JSON.


step_quality_rating: |
  Rate this individual reasoning step 0.0-1.0.

  Instruction: {instruction}
  Step {step_number} of {total_steps}:
    Thought:  {thought}
    Tool:     {tool}
    Args:     {args}
    Result:   {result}
  Previous context:
  {previous_context}

  Criteria: grounded reasoning, correct tool for the state, arg names match
  schema, realistic result, advances the workflow.

  Output: ONE JSON object.
  {{"rating": 0.85, "issues": [], "is_misleading": false, "reasoning": "<brief>"}}

  Return ONLY the JSON.


tool_semantic_verification: |
  Evaluate whether this tool execution correctly solves the user's request.

  User Request: {instruction}
  Steps:
  {steps_summary}
  Final Answer: {final_answer}

  Check: right tools, every part of request addressed, realistic results,
  no hallucinated tool/arg/return names.

  Output: ONE JSON object.
  {{"correct": true, "confidence": 0.95, "issues": [], "reasoning": "<brief>"}}

  Return ONLY the JSON.
